<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>部門の買い上げの内訳</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 80px}header{background:#111827;color:#fff;padding:22px 18px;border-radius:18px;margin-bottom:12px}h1{font-size:23px;margin:0 0 5px}header p{margin:0;color:#cbd5e1;font-size:13px}.panel,.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 12px #0000000d}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.tab{background:#e5e7eb;color:#374151;padding:13px}.tab.active{background:#111827;color:#fff}label{font-size:12px;font-weight:700;color:#6b7280;display:block;margin:6px 0}input,textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:11px;font-size:16px;background:#fff}textarea{min-height:88px;resize:vertical}button{border:0;border-radius:10px;padding:11px 13px;font-weight:700;font-size:14px}.add{width:100%;background:#e5e7eb;color:#111827;margin-top:8px}.danger{background:#fee2e2;color:#991b1b}.metricTitle{display:flex;gap:8px;align-items:center}.metricTitle input{font-weight:800;font-size:18px;border:0;padding-left:0}.metricTitle button{flex:0 0 auto}.metricName{font-size:18px;font-weight:800;margin-bottom:10px}.memoItem{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px 0}.monthTitle{font-size:20px;font-weight:800;margin:0 0 4px}.note{font-size:12px;color:#6b7280;margin:4px 0 10px}.empty{padding:18px;text-align:center;color:#9ca3af}.foot{font-size:11px;color:#9ca3af;text-align:center;margin-top:18px}.hidden{display:none}</style></head><body><div class="wrap"><header><h1 id="title">部門の買い上げの内訳</h1><p>月ごとの結果と、意識する指標を分けて記録</p></header><div class="panel"><label>部門名</label><input id="dept" placeholder="例：情報部門"><label>記録月</label><input id="month" type="month"></div><div class="tabs"><button id="tabObs" class="tab active" onclick="showTab('obs')">月ごとの観察記録</button><button id="tabMetric" class="tab" onclick="showTab('metric')">指標・意識メモ</button></div><section id="obsView"><div class="panel"><div id="monthLabel" class="monthTitle"></div><p class="note">設定している指標ごとに、その月の結果や気づきを記録</p></div><div id="monthMetrics"></div></section><section id="metricView" class="hidden"><div id="metrics"></div><button class="add" onclick="addMetric()">＋ 意識したい指標を追加</button></section><div class="foot">入力内容はこの端末に自動保存されます</div></div><script>const KEY='riekibumon-v2',OLD='riekibumon-v1',defaults=['高単価な接客商品の買い上げ一式','BB（ネット契約）','保証金額','ゲーム予約数'];let data=JSON.parse(localStorage.getItem(KEY)||'null');if(!data){const old=JSON.parse(localStorage.getItem(OLD)||'null');data={dept:old?.dept||'',months:{},metrics:(old?.metrics||defaults.map(n=>({id:crypto.randomUUID(),name:n}))).map(m=>({id:m.id||crypto.randomUUID(),name:m.name,memos:[]}))}}data.metrics=data.metrics||defaults.map(n=>({id:crypto.randomUUID(),name:n,memos:[]}));const now=new Date();month.value=now.toISOString().slice(0,7);dept.value=data.dept||'';function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function cur(){const m=month.value;if(!data.months[m])data.months[m]={};if(!data.months[m].metricRecords)data.months[m].metricRecords={};return data.months[m]}function rec(id){const c=cur();if(!c.metricRecords[id])c.metricRecords[id]={result:'',observation:'',next:''};return c.metricRecords[id]}function save(){data.dept=dept.value;localStorage.setItem(KEY,JSON.stringify(data));updateTitle()}function updateTitle(){title.textContent=(dept.value.trim()?dept.value.trim():'部門')+'の買い上げの内訳'}function renderMonth(){const[y,m]=month.value.split('-');monthLabel.textContent=`${y}年${Number(m)}月の観察記録`;monthMetrics.innerHTML=data.metrics.map((x,i)=>{const r=rec(x.id);return `<div class="card"><div class="metricName">${esc(x.name)}</div><label>この月の結果・実績</label><textarea placeholder="例：12件、前月比＋3件 など" oninput="setRec('${x.id}','result',this.value)">${esc(r.result)}</textarea><label>結果から分かったこと・気づき</label><textarea placeholder="例：PC買い替え客への声かけからBBにつながることが多かった" oninput="setRec('${x.id}','observation',this.value)">${esc(r.observation)}</textarea><label>次に意識すること</label><textarea placeholder="例：接客序盤で利用回線を確認する" oninput="setRec('${x.id}','next',this.value)">${esc(r.next)}</textarea></div>`}).join('')||'<div class="panel empty">指標を追加すると、ここに月別記録欄が表示されます</div>';save()}function setRec(id,k,v){rec(id)[k]=v;save()}function renderMetrics(){metrics.innerHTML=data.metrics.length?data.metrics.map((m,mi)=>`<div class="card"><div class="metricTitle"><input value="${esc(m.name)}" onchange="renameMetric(${mi},this.value)"><button class="danger" onclick="delMetric(${mi})">削除</button></div><p class="note">この指標を上げるために普段から意識することを残す</p>${(m.memos||[]).map((x,i)=>`<div class="memoItem"><textarea placeholder="例：PC接客では必ず回線利用状況を確認" onchange="editMemo(${mi},${i},this.value)">${esc(x)}</textarea><button class="danger" onclick="delMemo(${mi},${i})">メモ削除</button></div>`).join('')}<button class="add" onclick="addMemo(${mi})">＋ この指標にメモを追記</button></div>`).join(''):'<div class="panel empty">指標がありません</div>'}function showTab(t){obsView.classList.toggle('hidden',t!=='obs');metricView.classList.toggle('hidden',t!=='metric');tabObs.classList.toggle('active',t==='obs');tabMetric.classList.toggle('active',t==='metric')}function addMetric(){data.metrics.push({id:crypto.randomUUID(),name:'新しい指標',memos:[]});save();renderMetrics();renderMonth()}function renameMetric(i,v){data.metrics[i].name=v;save();renderMonth()}function delMetric(i){if(!confirm('この指標を削除しますか？'))return;data.metrics.splice(i,1);save();renderMetrics();renderMonth()}function addMemo(i){data.metrics[i].memos=data.metrics[i].memos||[];data.metrics[i].memos.push('');save();renderMetrics()}function editMemo(i,j,v){data.metrics[i].memos[j]=v;save()}function delMemo(i,j){data.metrics[i].memos.splice(j,1);save();renderMetrics()}dept.addEventListener('input',save);month.addEventListener('change',renderMonth);updateTitle();renderMonth();renderMetrics();save();</script></body></html>
