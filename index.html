<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2"><link rel="icon" type="image/png" href="./apple-touch-icon.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="部門利益"><title>部門の買い上げの内訳</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 80px}header{background:#111827;color:#fff;padding:22px 18px;border-radius:18px;margin-bottom:12px}h1{font-size:23px;margin:0 0 5px}header p{margin:0;color:#cbd5e1;font-size:13px}.panel,.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 12px #0000000d}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.tab{background:#e5e7eb;color:#374151;padding:12px 6px;font-size:13px}.tab.active{background:#111827;color:#fff}label{font-size:12px;font-weight:700;color:#6b7280;display:block;margin:6px 0}input,textarea,select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:11px;font-size:16px;background:#fff}textarea{min-height:88px;resize:vertical}button{border:0;border-radius:10px;padding:11px 13px;font-weight:700;font-size:14px}.add{width:100%;background:#e5e7eb;color:#111827;margin-top:8px}.analyze{width:100%;background:#111827;color:#fff;padding:14px;margin-top:10px;font-size:15px}.danger{background:#fee2e2;color:#991b1b}.metricTitle{display:flex;gap:8px;align-items:center}.metricTitle input{font-weight:800;font-size:18px;border:0;padding-left:0}.metricTitle button{flex:0 0 auto}.metricName{font-size:18px;font-weight:800;margin-bottom:10px}.memoItem{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px 0}.monthTitle{font-size:20px;font-weight:800;margin:0 0 4px}.note{font-size:12px;color:#6b7280;margin:4px 0 10px}.empty{padding:18px;text-align:center;color:#9ca3af}.foot{font-size:11px;color:#9ca3af;text-align:center;margin-top:18px}.hidden{display:none}.numRow{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:end}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.compareBox{background:#f9fafb;border-radius:10px;padding:10px}.compareBox b{display:block;font-size:17px}.compareBox span{font-size:11px;color:#6b7280}.up{color:#059669}.down{color:#dc2626}.flat{color:#6b7280}.trendTable{width:100%;border-collapse:collapse;font-size:13px}.trendTable th,.trendTable td{padding:8px 6px;border-bottom:1px solid #e5e7eb;text-align:right}.trendTable th:first-child,.trendTable td:first-child{text-align:left}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:20px;font-size:13px;display:none;z-index:9}</style></head><body><div class="wrap"><header><h1 id="title">部門の買い上げの内訳</h1><p>数値・観察・意識メモを月ごとに蓄積</p></header><div class="panel"><label>部門名</label><input id="dept" placeholder="例：情報部門"><label>記録月</label><input id="month" type="month"></div><div class="tabs"><button id="tabNum" class="tab active" onclick="showTab('num')">数値データ</button><button id="tabObs" class="tab" onclick="showTab('obs')">月ごとの観察</button><button id="tabMetric" class="tab" onclick="showTab('metric')">指標・意識メモ</button></div><section id="numView"><div class="panel"><div id="numMonthLabel" class="monthTitle"></div><p class="note">各指標の実績値を入力すると、前月比と前年同月比を自動表示します。</p></div><div id="numberMetrics"></div><div class="panel"><div class="metricName">月別推移</div><div id="trendWrap"></div></div><div class="panel"><div class="metricName">チャッピーで分析</div><p class="note">数値・前年同月比・観察記録・意識メモをまとめて分析用文章にします。</p><button class="analyze" onclick="copyForChatGPT()">🤖 チャッピー分析用にコピー</button></div></section><section id="obsView" class="hidden"><div class="panel"><div id="monthLabel" class="monthTitle"></div><p class="note">設定している指標ごとに、その月の結果や気づきを記録</p></div><div id="monthMetrics"></div></section><section id="metricView" class="hidden"><div id="metrics"></div><button class="add" onclick="addMetric()">＋ 意識したい指標を追加</button></section><div class="foot">入力内容はこの端末に自動保存されます</div></div><div id="toast" class="toast">分析用データをコピーしました</div><script>const KEY='riekibumon-v2',OLD='riekibumon-v1',defaults=['高単価な接客商品の買い上げ一式','BB（ネット契約）','保証金額','ゲーム予約数'];let data=JSON.parse(localStorage.getItem(KEY)||'null');if(!data){const old=JSON.parse(localStorage.getItem(OLD)||'null');data={dept:old?.dept||'',months:{},metrics:(old?.metrics||defaults.map(n=>({id:crypto.randomUUID(),name:n}))).map(m=>({id:m.id||crypto.randomUUID(),name:m.name,memos:[],unit:'件'}))}}data.metrics=data.metrics||defaults.map(n=>({id:crypto.randomUUID(),name:n,memos:[],unit:'件'}));data.metrics.forEach(m=>{if(!m.unit)m.unit=m.name.includes('金額')||m.name.includes('買い上げ')?'円':'件'});const now=new Date();month.value=now.toISOString().slice(0,7);dept.value=data.dept||'';function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function cur(){const m=month.value;if(!data.months[m])data.months[m]={};if(!data.months[m].metricRecords)data.months[m].metricRecords={};if(!data.months[m].numbers)data.months[m].numbers={};return data.months[m]}function rec(id){const c=cur();if(!c.metricRecords[id])c.metricRecords[id]={result:'',observation:'',next:''};return c.metricRecords[id]}function numFor(mon,id){return data.months?.[mon]?.numbers?.[id]??''}function save(){data.dept=dept.value;localStorage.setItem(KEY,JSON.stringify(data));updateTitle()}function updateTitle(){title.textContent=(dept.value.trim()?dept.value.trim():'部門')+'の買い上げの内訳'}function prevMonthStr(s){let[y,m]=s.split('-').map(Number);m--;if(m===0){m=12;y--}return `${y}-${String(m).padStart(2,'0')}`}function prevYearStr(s){let[y,m]=s.split('-');return `${Number(y)-1}-${m}`}function pct(n,o){if(n===''||o===''||Number(o)===0)return null;return((Number(n)-Number(o))/Number(o))*100}function diffClass(v){if(v===null||isNaN(v)||v===0)return'flat';return v>0?'up':'down'}function diffText(v){if(v===null||isNaN(v))return'比較なし';return`${v>0?'+':''}${v.toFixed(1)}%`}function setNumber(id,v){cur().numbers[id]=v;save();renderNumbers();renderTrend()}function renderNumbers(){const[y,m]=month.value.split('-');numMonthLabel.textContent=`${y}年${Number(m)}月の数値データ`;const pm=prevMonthStr(month.value),py=prevYearStr(month.value);numberMetrics.innerHTML=data.metrics.map(x=>{const n=numFor(month.value,x.id),pv=numFor(pm,x.id),yv=numFor(py,x.id),pp=pct(n,pv),yp=pct(n,yv);return`<div class="card"><div class="metricName">${esc(x.name)}</div><div class="numRow"><div><label>今月実績</label><input type="number" inputmode="decimal" value="${esc(n)}" placeholder="数値を入力" oninput="setNumber('${x.id}',this.value)"></div><div><label>単位</label><select onchange="setUnit('${x.id}',this.value)"><option ${x.unit==='件'?'selected':''}>件</option><option ${x.unit==='円'?'selected':''}>円</option><option ${x.unit==='台'?'selected':''}>台</option><option ${x.unit==='%'?'selected':''}>%</option><option ${x.unit==='ポイント'?'selected':''}>ポイント</option></select></div></div><div class="compare"><div class="compareBox"><span>前月 ${pv!==''?esc(pv)+x.unit:'未入力'}</span><b class="${diffClass(pp)}">${diffText(pp)}</b></div><div class="compareBox"><span>前年同月 ${yv!==''?esc(yv)+x.unit:'未入力'}</span><b class="${diffClass(yp)}">${diffText(yp)}</b></div></div></div>`}).join('')||'<div class="panel empty">指標を追加すると数値入力欄が表示されます</div>'}function setUnit(id,v){const m=data.metrics.find(x=>x.id===id);if(m)m.unit=v;save();renderNumbers();renderTrend()}function renderTrend(){const months=Object.keys(data.months||{}).sort();if(!months.length){trendWrap.innerHTML='<div class="empty">まだ月別データがありません</div>';return}let h='<div style="overflow:auto"><table class="trendTable"><thead><tr><th>月</th>'+data.metrics.map(m=>`<th>${esc(m.name)}</th>`).join('')+'</tr></thead><tbody>';months.forEach(mon=>{h+=`<tr><td>${mon}</td>`+data.metrics.map(m=>{const v=numFor(mon,m.id);return`<td>${v!==''?esc(v)+m.unit:'-'}</td>`}).join('')+'</tr>'});h+='</tbody></table></div>';trendWrap.innerHTML=h}function renderMonth(){const[y,m]=month.value.split('-');monthLabel.textContent=`${y}年${Number(m)}月の観察記録`;monthMetrics.innerHTML=data.metrics.map(x=>{const r=rec(x.id);return`<div class="card"><div class="metricName">${esc(x.name)}</div><label>この月の結果・実績</label><textarea placeholder="例：12件、前月比＋3件 など" oninput="setRec('${x.id}','result',this.value)">${esc(r.result)}</textarea><label>結果から分かったこと・気づき</label><textarea placeholder="気づきを入力" oninput="setRec('${x.id}','observation',this.value)">${esc(r.observation)}</textarea><label>次に意識すること</label><textarea placeholder="次の行動を入力" oninput="setRec('${x.id}','next',this.value)">${esc(r.next)}</textarea></div>`}).join('')||'<div class="panel empty">指標を追加すると、ここに月別記録欄が表示されます</div>';save()}function setRec(id,k,v){rec(id)[k]=v;save()}function renderMetrics(){metrics.innerHTML=data.metrics.length?data.metrics.map((m,mi)=>`<div class="card"><div class="metricTitle"><input value="${esc(m.name)}" onchange="renameMetric(${mi},this.value)"><button class="danger" onclick="delMetric(${mi})">削除</button></div><p class="note">この指標を上げるために普段から意識することを残す</p>${(m.memos||[]).map((x,i)=>`<div class="memoItem"><textarea placeholder="意識すること" onchange="editMemo(${mi},${i},this.value)">${esc(x)}</textarea><button class="danger" onclick="delMemo(${mi},${i})">メモ削除</button></div>`).join('')}<button class="add" onclick="addMemo(${mi})">＋ この指標にメモを追記</button></div>`).join(''):'<div class="panel empty">指標がありません</div>'}function buildAnalysis(){let s=`以下は${data.dept||'部門'}の買い上げ・利益改善のために記録したデータです。\n数値の推移、前年同月比、観察記録、普段意識している施策をまとめて分析してください。\n特に「伸びている指標」「弱くなっている指標」「結果につながっていそうな行動」「次月に優先すべき改善策」を具体的に教えてください。相関があっても因果関係と断定せずに分析してください。\n\n【月別データ】\n`;Object.keys(data.months||{}).sort().forEach(mon=>{s+=`\n■ ${mon}\n`;data.metrics.forEach(m=>{const v=numFor(mon,m.id),r=data.months[mon]?.metricRecords?.[m.id]||{};s+=`・${m.name}: ${v!==''?v+m.unit:'数値未入力'}\n`;if(r.result)s+=`  結果: ${r.result}\n`;if(r.observation)s+=`  気づき: ${r.observation}\n`;if(r.next)s+=`  次に意識: ${r.next}\n`})});s+='\n【指標ごとの普段の意識メモ】\n';data.metrics.forEach(m=>{s+=`\n■ ${m.name}\n`;const ms=(m.memos||[]).filter(Boolean);s+=ms.length?ms.map(x=>'・'+x).join('\n'):'・メモなし';s+='\n'});return s}async function copyForChatGPT(){const text=buildAnalysis();try{await navigator.clipboard.writeText(text);toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('分析用データをコピーしました')}}function showTab(t){numView.classList.toggle('hidden',t!=='num');obsView.classList.toggle('hidden',t!=='obs');metricView.classList.toggle('hidden',t!=='metric');tabNum.classList.toggle('active',t==='num');tabObs.classList.toggle('active',t==='obs');tabMetric.classList.toggle('active',t==='metric')}function addMetric(){data.metrics.push({id:crypto.randomUUID(),name:'新しい指標',memos:[],unit:'件'});save();renderMetrics();renderMonth();renderNumbers();renderTrend()}function renameMetric(i,v){data.metrics[i].name=v;save();renderMonth();renderNumbers();renderTrend()}function delMetric(i){if(!confirm('この指標を削除しますか？'))return;data.metrics.splice(i,1);save();renderMetrics();renderMonth();renderNumbers();renderTrend()}function addMemo(i){data.metrics[i].memos=data.metrics[i].memos||[];data.metrics[i].memos.push('');save();renderMetrics()}function editMemo(i,j,v){data.metrics[i].memos[j]=v;save()}function delMemo(i,j){data.metrics[i].memos.splice(j,1);save();renderMetrics()}dept.addEventListener('input',save);month.addEventListener('change',()=>{renderNumbers();renderMonth();renderTrend()});updateTitle();renderNumbers();renderMonth();renderMetrics();renderTrend();save();</script></body></html>
