<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><link rel="apple-touch-icon" sizes="180x180" href="./turtle-home-v7.png"><link rel="icon" type="image/png" href="./turtle-home-v7.png"><meta name="apple-mobile-web-app-title" content="部門利益"><title>部門の月振り返り</title><script>(async()=>{try{const r=await fetch('./version.txt?t='+Date.now(),{cache:'no-store'});const v=(await r.text()).trim();const k='riekibumon-build';const old=localStorage.getItem(k);if(old&&old!==v){localStorage.setItem(k,v);const u=new URL(location.href);u.searchParams.set('build',v);location.replace(u.toString());return}if(!old)localStorage.setItem(k,v)}catch(e){}})();</script><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 80px}header{background:#111827;color:#fff;padding:22px 18px;border-radius:18px;margin-bottom:12px}h1{font-size:23px;margin:0 0 5px}header p{margin:0;color:#cbd5e1;font-size:13px}.panel,.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 12px #0000000d}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.tab{background:#e5e7eb;color:#374151;padding:12px 6px;font-size:13px}.tab.active{background:#111827;color:#fff}label{font-size:12px;font-weight:700;color:#6b7280;display:block;margin:8px 0 6px}input,textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:11px;font-size:16px;background:#fff}textarea{min-height:82px;resize:vertical}button{border:0;border-radius:10px;padding:11px 13px;font-weight:700;font-size:14px}.add{width:100%;background:#e5e7eb;color:#111827;margin-top:8px}.analyze{width:100%;background:#111827;color:#fff;padding:14px;margin-top:10px;font-size:15px}.danger{background:#fee2e2;color:#991b1b}.metricTitle{display:flex;gap:8px;align-items:center}.metricTitle input{font-weight:800;font-size:18px;border:0;padding-left:0}.metricTitle button{flex:0 0 auto}.metricName{font-size:18px;font-weight:800;margin-bottom:8px}.memoItem{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px 0}.monthTitle{font-size:20px;font-weight:800;margin:0 0 4px}.note{font-size:12px;color:#6b7280;margin:4px 0 10px}.empty{padding:18px;text-align:center;color:#9ca3af}.foot{font-size:11px;color:#9ca3af;text-align:center;margin-top:18px}.hidden{display:none}.scoreWrap{margin:12px 0 4px;background:#f9fafb;border-radius:14px;padding:12px}.scoreHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}.scoreLabel{font-size:13px;font-weight:800}.scoreValue{font-size:20px;font-weight:900;min-width:46px;text-align:right}.good{color:#059669}.bad{color:#dc2626}.neutral{color:#6b7280}.range{width:100%;accent-color:#111827}.scale{display:flex;justify-content:space-between;font-size:11px;color:#9ca3af}.compareCard{overflow:hidden}.miniChart{position:relative;height:180px;margin:12px 0 4px;padding:0 4px}.zero{position:absolute;left:0;right:0;top:50%;border-top:2px solid #d1d5db}.chartRows{position:absolute;inset:0;display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding:0 2px}.monthCol{min-width:52px;flex:1;display:grid;grid-template-rows:1fr 22px;gap:4px}.barArea{position:relative}.bar{position:absolute;left:20%;width:60%;border-radius:7px 7px 3px 3px;background:#111827;min-height:3px}.bar.pos{bottom:50%}.bar.neg{top:50%;border-radius:3px 3px 7px 7px}.monthText{text-align:center;font-size:10px;color:#6b7280;white-space:nowrap}.chartNote{font-size:11px;color:#9ca3af}.history{margin-top:12px}.historyItem{border-top:1px solid #e5e7eb;padding:10px 0}.historyTop{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.historyMemo{font-size:12px;color:#4b5563;margin-top:5px;white-space:pre-wrap}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:20px;font-size:13px;display:none;z-index:9}</style></head><body><div class="wrap"><header><h1 id="title">部門の月振り返り</h1><p>月ごとの良かった点・悪かった点・次の意識を蓄積</p></header><div class="panel"><label>部門名</label><input id="dept" placeholder="例：情報部門"><label>振り返る月</label><input id="month" type="month"></div><div class="tabs"><button id="tabReview" class="tab active" onclick="showTab('review')">月の振り返り</button><button id="tabMetric" class="tab" onclick="showTab('metric')">項目・意識メモ</button></div><section id="reviewView"><div class="panel"><div id="monthLabel" class="monthTitle"></div><p class="note">各項目を −5〜＋5 で評価。良かった月は上、悪かった月は下にグラフ表示されます。</p></div><div id="monthMetrics"></div><div class="panel"><div class="metricName">月ごとの比較</div><p class="note">項目ごとに、過去の振り返りを上下の棒で比較できます。</p><div id="comparison"></div></div><div class="panel"><div class="metricName">チャッピーで分析</div><p class="note">月ごとの評価・メモ・普段の意識をまとめてコピーします。</p><button class="analyze" onclick="copyForChatGPT()">🤖 チャッピー分析用にコピー</button></div></section><section id="metricView" class="hidden"><div id="metrics"></div><button class="add" onclick="addMetric()">＋ 振り返り項目を追加</button></section><div class="foot">入力内容はこの端末に自動保存されます</div></div><div id="toast" class="toast">分析用データをコピーしました</div><script>const KEY='riekibumon-v2',defaults=['高単価な接客商品の買い上げ一式','BB（ネット契約）','保証金額','ゲーム予約数'];let data=JSON.parse(localStorage.getItem(KEY)||'null')||{dept:'',months:{},metrics:defaults.map(n=>({id:crypto.randomUUID(),name:n,memos:[]}))};data.months=data.months||{};data.metrics=data.metrics||defaults.map(n=>({id:crypto.randomUUID(),name:n,memos:[]}));data.metrics.forEach(m=>{m.memos=m.memos||[]});const now=new Date();month.value=now.toISOString().slice(0,7);dept.value=data.dept||'';function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function cur(){const k=month.value;if(!data.months[k])data.months[k]={};if(!data.months[k].metricRecords)data.months[k].metricRecords={};return data.months[k]}function rec(id){const c=cur();if(!c.metricRecords[id])c.metricRecords[id]={result:'',observation:'',next:'',score:0};if(c.metricRecords[id].score===undefined)c.metricRecords[id].score=0;return c.metricRecords[id]}function save(){data.dept=dept.value;localStorage.setItem(KEY,JSON.stringify(data));updateTitle()}function updateTitle(){title.textContent=(dept.value.trim()?dept.value.trim():'部門')+'の月振り返り'}function scoreClass(v){v=Number(v)||0;return v>0?'good':v<0?'bad':'neutral'}function scoreText(v){v=Number(v)||0;return v>0?`＋${v}`:String(v)}function setRec(id,k,v){rec(id)[k]=k==='score'?Number(v):v;save();if(k==='score'){renderMonth();renderComparison()}}function renderMonth(){const[y,m]=month.value.split('-');monthLabel.textContent=`${y}年${Number(m)}月の振り返り`;monthMetrics.innerHTML=data.metrics.map(x=>{const r=rec(x.id),sc=Number(r.score)||0;return`<div class="card"><div class="metricName">${esc(x.name)}</div><div class="scoreWrap"><div class="scoreHead"><span class="scoreLabel">今月の感触</span><span class="scoreValue ${scoreClass(sc)}">${scoreText(sc)}</span></div><input class="range" type="range" min="-5" max="5" step="1" value="${sc}" oninput="setRec('${x.id}','score',this.value)"><div class="scale"><span>−5 悪かった</span><span>0</span><span>＋5 良かった</span></div></div><label>この月の結果・実績</label><textarea placeholder="例：予約が伸びた、保証が弱かった など" oninput="setRec('${x.id}','result',this.value)">${esc(r.result||'')}</textarea><label>気づいたこと・原因</label><textarea placeholder="なぜ良かった／悪かったか" oninput="setRec('${x.id}','observation',this.value)">${esc(r.observation||'')}</textarea><label>次の月に意識すること</label><textarea placeholder="次に続けること・改善すること" oninput="setRec('${x.id}','next',this.value)">${esc(r.next||'')}</textarea></div>`}).join('')||'<div class="panel empty">項目を追加すると振り返り欄が表示されます</div>';save()}function renderComparison(){const months=Object.keys(data.months).sort();comparison.innerHTML=data.metrics.map(metric=>{const rows=months.map(mon=>{const r=data.months[mon]?.metricRecords?.[metric.id];if(!r)return null;const score=Number(r.score)||0;const h=Math.max(3,Math.abs(score)*10);return{mon,r,score,h}}).filter(Boolean);if(!rows.length)return`<div class="compareCard"><div class="metricName">${esc(metric.name)}</div><div class="empty">まだ振り返りデータがありません</div></div>`;const bars=rows.map(o=>`<div class="monthCol"><div class="barArea"><div class="bar ${o.score<0?'neg':'pos'}" style="height:${o.h}%" title="${o.mon} ${scoreText(o.score)}"></div></div><div class="monthText">${o.mon.slice(2)}</div></div>`).join('');const history=rows.slice().reverse().map(o=>{const memo=o.r.observation||o.r.result||o.r.next||'';return`<div class="historyItem"><div class="historyTop"><span>${esc(o.mon)}</span><span class="${scoreClass(o.score)}">${scoreText(o.score)}</span></div>${memo?`<div class="historyMemo">${esc(memo)}</div>`:''}</div>`}).join('');return`<div class="compareCard"><div class="metricName">${esc(metric.name)}</div><div class="miniChart"><div class="zero"></div><div class="chartRows">${bars}</div></div><div class="chartNote">中央線より上＝良かった / 下＝悪かった</div><div class="history">${history}</div></div>`}).join('<hr style="border:0;border-top:1px solid #e5e7eb;margin:18px 0">')}function renderMetrics(){metrics.innerHTML=data.metrics.length?data.metrics.map((m,mi)=>`<div class="card"><div class="metricTitle"><input value="${esc(m.name)}" onchange="renameMetric(${mi},this.value)"><button class="danger" onclick="delMetric(${mi})">削除</button></div><p class="note">この項目で普段から意識することを残します。</p>${(m.memos||[]).map((x,i)=>`<div class="memoItem"><textarea placeholder="意識すること" onchange="editMemo(${mi},${i},this.value)">${esc(x)}</textarea><button class="danger" onclick="delMemo(${mi},${i})">メモ削除</button></div>`).join('')}<button class="add" onclick="addMemo(${mi})">＋ この項目にメモを追記</button></div>`).join(''):'<div class="panel empty">項目がありません</div>'}function buildAnalysis(){let s=`以下は${data.dept||'部門'}の月ごとの振り返りです。\n各項目を-5〜+5で主観評価しています。良かった点・悪かった点の傾向、繰り返している原因、次月に優先すべき行動を具体的に分析してください。\n\n【月別振り返り】\n`;Object.keys(data.months).sort().forEach(mon=>{s+=`\n■ ${mon}\n`;data.metrics.forEach(m=>{const r=data.months[mon]?.metricRecords?.[m.id];if(!r)return;s+=`・${m.name} 評価:${scoreText(r.score||0)}\n`;if(r.result)s+=`  結果:${r.result}\n`;if(r.observation)s+=`  気づき:${r.observation}\n`;if(r.next)s+=`  次に意識:${r.next}\n`})});s+='\n【普段の意識メモ】\n';data.metrics.forEach(m=>{s+=`\n■ ${m.name}\n`;const ms=(m.memos||[]).filter(Boolean);s+=ms.length?ms.map(x=>'・'+x).join('\n'):'・メモなし';s+='\n'});return s}async function copyForChatGPT(){const text=buildAnalysis();try{await navigator.clipboard.writeText(text);toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('分析用データをコピーしました')}}function showTab(t){reviewView.classList.toggle('hidden',t!=='review');metricView.classList.toggle('hidden',t!=='metric');tabReview.classList.toggle('active',t==='review');tabMetric.classList.toggle('active',t==='metric')}function addMetric(){data.metrics.push({id:crypto.randomUUID(),name:'新しい項目',memos:[]});save();renderMetrics();renderMonth();renderComparison()}function renameMetric(i,v){data.metrics[i].name=v;save();renderMonth();renderComparison()}function delMetric(i){if(!confirm('この項目を削除しますか？'))return;data.metrics.splice(i,1);save();renderMetrics();renderMonth();renderComparison()}function addMemo(i){data.metrics[i].memos.push('');save();renderMetrics()}function editMemo(i,j,v){data.metrics[i].memos[j]=v;save()}function delMemo(i,j){data.metrics[i].memos.splice(j,1);save();renderMetrics()}dept.addEventListener('input',save);month.addEventListener('change',()=>{renderMonth();renderComparison()});updateTitle();renderMonth();renderMetrics();renderComparison();save();</script></body></html>
