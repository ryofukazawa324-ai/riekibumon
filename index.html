<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>部門利益</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:18px 14px 80px}header{background:#111827;color:white;padding:22px 18px;border-radius:18px;margin-bottom:14px}h1{font-size:24px;margin:0 0 5px}header p{margin:0;color:#cbd5e1;font-size:13px}.panel,.card{background:white;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 12px #0000000d}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}label{font-size:12px;font-weight:700;color:#6b7280;display:block;margin:6px 0}input,textarea,select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:11px;font-size:16px;background:white}textarea{min-height:75px;resize:vertical}button{border:0;border-radius:10px;padding:11px 13px;font-weight:700;font-size:14px}.primary{background:#111827;color:white}.add{background:#e5e7eb;color:#111827;width:100%;margin-top:10px}.danger{background:#fee2e2;color:#991b1b;flex:0 0 auto}.metricHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.metricHead input{font-weight:800;font-size:18px;border:0;padding:4px 0}.ideas{margin-top:12px}.idea{background:#f9fafb;border:1px solid #e5e7eb;padding:10px;border-radius:12px;margin:8px 0}.idea textarea{background:white}.ideaActions{display:flex;gap:7px;margin-top:7px}.ideaActions select{font-size:13px;padding:8px}.ideaActions button{padding:8px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#f9fafb;padding:11px;border-radius:12px}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:#6b7280}.foot{font-size:11px;color:#9ca3af;text-align:center;margin-top:18px}
</style></head>
<body><div class="wrap"><header><h1>部門利益 改善トラッカー</h1><p>数字と施策を残して、利益につながる行動を見つける</p></header>
<div class="panel"><label>部門名</label><input id="dept" placeholder="例：情報部門"><div class="row"><div><label>記録月</label><input id="month" type="month"></div><div><label>部門利益（任意）</label><input id="profit" type="number" inputmode="numeric" placeholder="円"></div></div></div>
<div id="summary" class="panel"></div><div id="metrics"></div><button class="add" onclick="addMetric()">＋ 意識したい指標を追加</button><div class="foot">入力内容はこの端末に自動保存されます</div></div>
<script>
const KEY='riekibumon-v1';
const defaults=['高単価な接客商品の買い上げ一式','BB（ネット契約）','保証金額','ゲーム予約数'];
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{dept:'',months:{},metrics:defaults.map(n=>({id:crypto.randomUUID(),name:n}))};
const now=new Date(); month.value=now.toISOString().slice(0,7); dept.value=data.dept||'';
function cur(){let m=month.value;if(!data.months[m])data.months[m]={profit:'',values:{}};return data.months[m]}
function save(){data.dept=dept.value;cur().profit=profit.value;localStorage.setItem(KEY,JSON.stringify(data));renderSummary()}
function valObj(id){let c=cur();if(!c.values[id])c.values[id]={current:'',target:'',ideas:[]};return c.values[id]}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){profit.value=cur().profit||'';metrics.innerHTML=data.metrics.map(m=>{let v=valObj(m.id);return `<div class="card"><div class="metricHead"><input value="${esc(m.name)}" onchange="rename('${m.id}',this.value)"><button class="danger" onclick="delMetric('${m.id}')">削除</button></div><div class="row"><div><label>現状</label><input type="number" inputmode="decimal" value="${esc(v.current)}" placeholder="数値" onchange="setv('${m.id}','current',this.value)"></div><div><label>目標</label><input type="number" inputmode="decimal" value="${esc(v.target)}" placeholder="数値" onchange="setv('${m.id}','target',this.value)"></div></div><div class="ideas"><label>どうすれば上がるか・試すこと</label>${v.ideas.map((x,i)=>`<div class="idea"><textarea placeholder="例：PC接客時に回線利用状況を必ず確認" onchange="idea('${m.id}',${i},'text',this.value)">${esc(x.text)}</textarea><div class="ideaActions"><select onchange="idea('${m.id}',${i},'status',this.value)"><option ${x.status==='未実施'?'selected':''}>未実施</option><option ${x.status==='実施中'?'selected':''}>実施中</option><option ${x.status==='効果あり'?'selected':''}>効果あり</option><option ${x.status==='変化なし'?'selected':''}>変化なし</option></select><button class="danger" onclick="delIdea('${m.id}',${i})">削除</button></div></div>`).join('')}<button class="add" onclick="addIdea('${m.id}')">＋ 施策・メモを追記</button></div></div>`}).join('');renderSummary();localStorage.setItem(KEY,JSON.stringify(data))}
function renderSummary(){let c=cur(),done=0,total=0;data.metrics.forEach(m=>(c.values[m.id]?.ideas||[]).forEach(x=>{total++;if(x.status==='効果あり')done++}));summary.innerHTML=`<div class="summary"><div class="stat"><b>${data.metrics.length}</b><span>重点指標</span></div><div class="stat"><b>${done}/${total}</b><span>効果あり施策 / 全施策</span></div></div>`}
function setv(id,k,v){valObj(id)[k]=v;save()}function rename(id,v){data.metrics.find(x=>x.id===id).name=v;save()}function addIdea(id){valObj(id).ideas.push({text:'',status:'未実施'});render()}function idea(id,i,k,v){valObj(id).ideas[i][k]=v;save()}function delIdea(id,i){valObj(id).ideas.splice(i,1);render()}function addMetric(){data.metrics.push({id:crypto.randomUUID(),name:'新しい指標'});render()}function delMetric(id){if(!confirm('この指標を削除しますか？'))return;data.metrics=data.metrics.filter(x=>x.id!==id);render()}
dept.addEventListener('input',save);profit.addEventListener('input',save);month.addEventListener('change',render);render();
</script></body></html>
